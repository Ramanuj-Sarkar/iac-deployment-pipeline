services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: `docker compose run --rm tests`
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    entrypoint: ["pytest"]
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
